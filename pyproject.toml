[project]
name = "tavily-mux"
version = "0.1.0"
description = "A high-performance Tavily API key pool and transparent search proxy"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "tropical-algae" }]
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=49.0,<50",
  "fastapi>=0.139.2,<0.140",
  "h2>=4.3,<5",
  "httpx2>=2.7,<3",
  "loguru>=0.7.3,<1",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.14.2,<3",
  "pyyaml>=6.0.3,<7",
  "sqlalchemy>=2.0.51,<3",
  "uvicorn[standard]>=0.51,<0.52",
]

[project.scripts]
tavily-mux = "tavily_mux.cli:run"

[dependency-groups]
dev = [
  "mypy>=2.3,<3",
  "poethepoet>=0.48,<1",
  "pre-commit>=4.4,<5",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "respx>=0.22,<1",
  "ruff>=0.15,<0.16",
  "types-pyyaml>=6.0,<7",
]
release = ["python-semantic-release>=10.6,<11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tavily_mux"]

[tool.uv]
default-groups = ["dev"]

[tool.poe]
include = "poe_tasks.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "--cov=tavily_mux",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml:coverage.xml",
  "--cov-fail-under=70",
]

[tool.coverage.run]
concurrency = ["thread"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["src/tavily_mux/persistence/migrations"]

[tool.ruff]
target-version = "py313"
line-length = 96
extend-exclude = ["src/tavily_mux/persistence/migrations/versions"]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PT",
  "PTH",
  "RET",
  "RUF",
  "SIM",
  "T10",
  "T20",
  "UP",
  "W",
]
ignore = ["B008", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
